name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Spin up a throwaway Postgres for the CI run. The Prisma schema is
    # postgresql-only (since the Supabase switch); CI needs a Postgres
    # to push the schema against + run the test suite. The container
    # is automatically wired into the job network as host "postgres".
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: equiwings_test
        ports:
          - 5432:5432
        # Wait for Postgres to accept connections before the first step runs.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Both URLs point at the same local Postgres. In production these
      # split (pooled vs direct); in CI we don't have a pooler and don't
      # need one.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/equiwings_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/equiwings_test
      JWT_SECRET: ci-test-secret-not-used-for-real-tokens
      OWNER_JWT_SECRET: ci-test-owner-secret-distinct-from-above
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Push schema to CI Postgres
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Production build (smoke)
        # Catches "works in dev, breaks on `next build`" issues — common
        # with client/server boundary mistakes and missing env vars.
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
