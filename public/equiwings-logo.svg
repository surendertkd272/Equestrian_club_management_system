  <g transform="translate(150 50) scale(3)" fill="#e11d48">
    <path d="M-2.5 -14 L0 -16 L2 -14 L3 -11 L5 -10 L6 -8 L7 -5 L7 -1 L5 1 L3 2 L3 6 L5 8 L5 11 L2 11 L1 8 L-2 8 L-3 11 L-6 11 L-6 8 L-4 6 L-4 2 L-7 1 L-9 -1 L-9 -4 L-7 -3 L-5 -5 L-3 -7 L-3 -11 z"/>
  </g>
  <text x="150" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#e11d48" letter-spacing="2">EQUIWINGS</text>
</svg>
